                <div class="col-6 text-center">

                </div>

                    <div class="box p-4 border border-dark text-light" id="oNumber">

                    </div>
                </div>
                <!-- buttons code paste here############-->
                <div class="row mt-3">
                    <div class="col-6 text-center mb-5">
                        <h3>Buttons</h3>
                        <div class="box border border-dark p-2 text-center">
                        <button class="btn btn-danger p-2 mb-2 btn-sm col-5" onclick="today()">Get Name of Today</button>
                        <button class="btn btn-danger p-2 mb-2 btn-sm col-5" onclick="calculateDays()">Calculate Days Passed</button>
                        <button class="btn btn-danger p-2 mb-2 btn-sm col-5" onclick="birthday()">When is Your Next Birthday</button>

                        <button class="btn btn-danger p-2 mb-2 btn-sm col-5" onclick="time2()">Tell Time 2</button>
                        <button class="btn btn-danger p-2 mb-2 btn-sm col-5" onclick="time3()">Tell Time 3</button>
                        <button class="btn btn-danger p-2 mb-2 btn-sm col-5" onclick="tax()">calculate Tax</button>
                        <button class="btn btn-danger p-2 mb-2 btn-sm col-5" onclick="priceTax()">Calculate Total = Price + Tax</button>
                
                    </div>
                    
                </div>
                
                <!-- OUTPUT CODE PASTE HERE ############## -->

                <h3>Output</h3>
                <div id="out" class="box border border-dark p-2 text-center">

                    </div>
                   <div class="row">
                    <div class="col6 mt-3">

                    </div>
                   </div>
