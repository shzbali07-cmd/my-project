            </div>
            </div>

    <!--main content start from here################  -->
    <main class="bg-body-secondary">

                <hr>
            </div>
            <!--input button or field code here################  -->

            <div class="row mt-1">

                    <h3>Buttons</h3>
                    <div class="box border border-dark p-2 text-center">
                        <button class="btn btn-danger p-2 mb-2 btn-sm col-6" onclick="showImage()">Show

                        <button class="btn btn-danger p-2 mb-2 btn-sm col-6" onclick="showTable()">Show Table</button>

                            Console</button>


                    </div>

                </div>
                <!-- form code here -->
                <div class="col-6 text-center mb-5">
                <form onsubmit="handleSubmit()">
                    
                    <h3>Form</h3>
                    <div class="box border border-dark p-3" id="form">
                        <div class="row g-2">

                            <div class="col-md-6">
                                <input id="firstName" type="text" class="form-control" placeholder="First Name">
                            </div>

                            <div class="col-md-6">
                                <input id="lastName" type="text" class="form-control" placeholder="Last Name">
                            </div>

                            <div class="col-md-6">
                                <input id="email" type="text" class="form-control" placeholder="Email">
                            </div>

                            <div class="col-md-6">
                                <input id="dob" type="date" class="form-control">
                            </div>

                                <input type="submit" value="Add User" class="btn btn-success w-50 m-auto w-sm-100 d-block mt-2">


                        </div>
                    </form>
                    </div>

                    <!-- OUTPUT CODE PASTE HERE ############## -->



                    
                     <div class="row">

                         <div class="col-12 text-center mb-5 mt-3 ">
                             <h3>Output</h3>
                             <div id="out" class="box border border-dark p-2 text-center">
     
                             </div>
                     </div>
                        <div class="row">
                            <div class="col-6 mt-0 text-center">
                                <button class="btn btn-outline-secondary sm " onclick="clearOutPut()">Clear
                                    Output</button>
                            </div>
                        </div>


                        <!-- </div> container -->
                    </div>

    </main>

    <footer>
        <div class="mt-5 text-center">
