                    <button class="btn btn-outline-light" type="submit">Search</button>

            </div>
            </div>
        </nav>
    </header>

    <!--main content start from here################  -->
    <main class="bg-body-secondary">
        <div class="container">
            <div class="row text-center py-5">
                <h3>Chapter # 76-81| Browser Control | Propups</h3>
                <hr>
            </div>
            <!--input button or field code here################  -->
            <!-- buttons code paste here############-->
            <div class="row mt-1">
                <div class="col-12 text-center mb-5">
                    <!-- <h3>Buttons</h3> -->
                    <div class="box border border-dark p-2 text-center">
                        <button class="btn btn-danger p-1 px-2 btn-sm  col " onclick="whereWe()">Where WE AT </button>

                        <button class="btn btn-danger p-1 px-2 btn-sm  col " onclick="replaceUrl()">Replace URL </button>
                        <button class="btn btn-danger p-1 px-2 btn-sm  col " onclick="popupOpen()">Open Popup </button>
                        <button class="btn btn-danger p-1 px-2 btn-sm  col " onclick="fileConvert()">File Convert in Popup </button>
                        <button class="btn btn-danger p-1 px-2 btn-sm  col " onclick="assignUrl()">Assign URL To Popup </button>
                        <button class="btn btn-danger p-1 px-2 btn-sm  col " onclick="closePopup()">Close Popup</button>


                    </div>

                </div>

                <!-- OUTPUT CODE PASTE HERE ############## -->

                <div class="col-12 text-center mb-3 mt-3">
                    <h3>Output/Result</h3>
                    <div id="out" class="box border border-dark p-2 text-center"></div>
                </div>

                <div class="row mt-1">
                    <div class="col-12 text-center">
                        <button class="btn btn-success btn-sm" onclick="clearOutPut()">

                        </button>
                    </div>
                </div>


                <!-- </div> container -->
            </div>

    </main>

    <footer>
