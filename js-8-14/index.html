    <header>
<nav class="navbar navbar-expand-lg bg-navbar navbar-dark">
  <div class="container">

      </div>
      <hr class="bg-dark">

       <!-- buttons code here -->
        <div class="row">
            <div class="col-12 border border-secondary py-2 text-center mt-3">
                <button id="btn-string" class="btn btn-danger  mb-2 cl-5  btn-sm  " onclick="concatenations()">Concatenation Strings</button>
                <button id="btn-askName" class="btn btn-danger  mb-2 cl-6  btn-sm  " onclick="askName()">Ask Name From User</button>

                <button id="btn-testing" class="btn btn-danger  mb-2 cl-6  btn-sm  " onclick="testing()">Testing Sets of Conditions</button>
                <button id="btn-nested" class="btn btn-danger  mb-2 cl-6  btn-sm  " onclick="nested()">if Statments Nested</button>
                <button id="btn-login" class="btn btn-danger  mb-2 cl-6  btn-sm  " onclick="login()">Login</button>

        </div>

         <h5 class="text-center mt-5">Original Statment</h5>

            </div>
         </div>
         
          <div class="text-center">
            <button id="clearOutput" class="btn btn-outline-dark btn-sm mt-2" onclick="clearOutput()">Clear Output</button>
